<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><title>HYROX Smart Coach</title><style>
*{box-sizing:border-box}body{margin:0;background:#07111f;color:#eef6ff;font-family:system-ui}.app{max-width:760px;margin:auto;padding:18px 14px 60px}.hero{display:flex;gap:12px;align-items:center}.logo{width:54px;border-radius:15px}h1{font-size:24px;margin:0}.muted{color:#9fb0c5;font-size:13px}.card{background:#101f33;border:1px solid #29405b;border-radius:18px;padding:16px;margin:14px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#152941;border-radius:12px;padding:10px;text-align:center}.stat b{display:block;color:#f59e0b;font-size:18px}.tabs,.modes,.actions{display:flex;gap:7px;overflow:auto;flex-wrap:wrap}.btn{border:1px solid #29405b;background:#152941;color:#eef6ff;border-radius:11px;padding:10px 12px;min-height:44px;font-weight:700}.btn.on,.primary{background:#f59e0b;color:#171008}.ex{border-top:1px solid #29405b;padding:12px 0}.ex h3{margin:0 0 5px;font-size:15px}.set{display:grid;grid-template-columns:1fr 80px;gap:8px;align-items:center;margin:7px 0}input,textarea{width:100%;background:#081524;border:1px solid #29405b;color:white;border-radius:9px;padding:10px;font-size:16px}textarea{min-height:65px}.bar{height:8px;background:#081524;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#f59e0b}.adapt{border-left:4px solid #f59e0b}.ok{color:#86efac}@media(max-width:400px){.stats{grid-template-columns:1fr 1fr}}
</style></head><body><main class="app"><div class="hero"><img class="logo" src="icon-192.png"><div><h1>HYROX Smart Coach <small style="font-size:12px;color:#9fb0c5">V4</small></h1><div class="muted">Solo RX · objectif 1h25 · adaptatif</div></div></div>
<section class="card"><div class="stats"><div class="stat"><b id="wn">1</b>Semaine</div><div class="stat"><b id="pct">0%</b>Réalisé</div><div class="stat"><b>27'50</b>5 km départ</div></div><div class="bar"><i id="bar"></i></div></section>
<div class="tabs" id="tabs"></div><section class="card" id="day"></section>
<section class="card adapt"><h2>Bilan & adaptation</h2><p class="muted">Le moteur adapte séparément course, jambes et haut du corps.</p><div class="stats"><label>Global /10<input id="wg" type="number" min="1" max="10" value="5"></label><label>Jambes /10<input id="wl" type="number" min="1" max="10" value="5"></label><label>Bras /10<input id="wa" type="number" min="1" max="10" value="5"></label></div><label>Commentaire<textarea id="note"></textarea></label><div class="actions"><button id="close" class="btn primary">Conclure la semaine → adapter</button></div><div id="result"></div></section>
<p class="muted">Données enregistrées sur cet appareil. Une séance manquée n'est jamais rattrapée automatiquement.</p></main><script>
(()=>{const D=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
const B={
Lundi:{h:[
['Échauffement jambes','Prépare les genoux, chevilles et hanches avant le bloc jambes.',[['Marche / footing facile (min)',5],['Squats poids du corps',15]]],
['Step-ups — gilet 5 kg','Support parfaitement stable. Pied entier sur le support, pousse avec la jambe qui travaille, monte jusqu’à extension de hanche puis redescends sous contrôle. Évite de te propulser avec la jambe arrière.',[['Série 1 — chaque jambe',10],['Série 2 — chaque jambe',10],['Série 3 — chaque jambe',10]]],
['Wall Sit — chaise au mur','Dos plaqué au mur, cuisses proches de l’horizontale. Ton niveau actuel est 40 s de travail / 40 s de récupération : on conserve ce repère.',[['Série 1 (sec)',40],['Repos (sec)',40],['Série 2 (sec)',40],['Repos (sec)',40],['Série 3 (sec)',40]]],
['Squats — gilet 5 kg','Pieds environ largeur d’épaules, descente contrôlée, genoux dans l’axe des pieds et extension complète en haut.',[['Série 1',15],['Série 2',15],['Série 3',15]]],
['Fentes marchées — gilet 5 kg','Pas suffisamment long pour garder le contrôle. Genou arrière vers le sol, buste droit. Alterne jambe droite / gauche.',[['Série 1 — pas totaux',20],['Série 2 — pas totaux',20],['Série 3 — pas totaux',20]]],
['Repos avant haut du corps','Récupère avant de passer aux pompes / Pike / dips.',[['Repos (sec)',90]]],
['Pompes normales','Sans gilet. Ton max actuel est 10 : on reste volontairement sous le max avec 1–2 répétitions en réserve.',[['Série 1',6],['Série 2',6],['Série 3',6]]],
['Pike Push-ups','Sans gilet. Hanches hautes, tête descend entre les mains. Ton max actuel est 10 mais on privilégie la qualité.',[['Série 1',5],['Série 2',5],['Série 3',5]]],
['Dips','Sans gilet, sur un support parfaitement stable. Épaules basses, amplitude confortable et mouvement contrôlé.',[['Série 1',6],['Série 2',6],['Série 3',6]]]
],c:'Coaching à la place de la séance maison. Si tu choisis coaching, note le contenu et ton ressenti.'},
Mardi:{h:[
['Échauffement course','Avant le fractionné : course très tranquille. Tu dois pouvoir parler facilement.',[['Course facile (min)',10]]],
['Fractionné tapis','6 × 400 m à 12 km/h. Après CHAQUE 400 m : 1 min 30 de récupération en marchant à environ 5–6 km/h.',[['400 m @ 12 km/h (répétitions)',6],['Récupération après chaque 400 m (sec)',90]]],
['Retour au calme','Après le dernier 400 m : marche ou petit footing très facile.',[['Retour au calme (min)',5]]]
],c:'Séance course/conditioning coach. Ne double pas avec le fractionné maison.'},
Mercredi:{h:[['Repos / mobilité','Aucun rattrapage. Mobilité douce facultative.',[]]],c:'Si coaching : récupération légère uniquement.'},
Jeudi:{h:[
['HYROX maison — 4 tours','Tu fais 4 TOURS complets. Dans chaque tour : 800 m de course → 15 Burpee Broad Jumps → 20 m de fentes marchées (ou 20 step-ups si besoin) → 20 squats avec le gilet de 5 kg. Repos maximum 90 s après les squats, puis tu repars sur les 800 m. Le vrai sled reste prioritaire avec le coach.',[['Nombre de tours',4],['Course PAR TOUR (m)',800],['Burpee Broad Jumps PAR TOUR',15],['Fentes marchées PAR TOUR (m)',20],['Squats gilet 5 kg PAR TOUR',20],['Repos max entre les tours (sec)',90]]]
],c:'HYROX coach — priorité au vrai sled, aux stations et aux transitions. Si tu fais le coaching, il remplace totalement la séance maison.'},
Vendredi:{h:[['Cindy maison — AMRAP 20 min','1 tour = 10 tirages élastique + 10 pompes + 15 Air Squats. Si élastique trop dur : 8 tirages propres.',[['Tirages',10],['Pompes',10],['Air Squats',15]]]],c:'Cross Training coach. Pas de Cindy en plus.'},
Samedi:{h:[['Repos complet','Journée de récupération. Aucun entraînement HYROX programmé et aucun rattrapage des séances manquées.',[]]],c:'Repos complet.'},
Dimanche:{h:[['Course tranquille','Footing facile en aisance respiratoire. Tu dois pouvoir parler en phrases. Ne cherche ni chrono ni performance. Tapis : environ 8,8–9,6 km/h seulement si cette allure reste facile.',[['Course tranquille (min)',40]]]],c:'Course tranquille.'}};
let S=JSON.parse(localStorage.getItem('hsCoach')||'null')||{w:1,d:{},lev:{u:0,r:0,l:0},hist:[]},sel='Lundi';const save=()=>localStorage.setItem('hsCoach',JSON.stringify(S)),ds=d=>S.d[d]||(S.d[d]={mode:'home',status:'todo',rpe:5,note:'',actual:{}});
function ex(d){let a=JSON.parse(JSON.stringify(B[d].h));if(d==='Lundi')a.slice(6).forEach(x=>x[2].forEach(s=>s[1]=Math.min(10,s[1]+S.lev.u)));if(d==='Mardi')a[1][2][0][1]=Math.min(10,6+S.lev.r);return a}
function render(){let t=document.getElementById('tabs');t.innerHTML='';D.forEach(d=>{let b=document.createElement('button'),q=ds(d);b.className='btn '+(d===sel?'on':'');b.textContent=d.slice(0,3)+(q.status==='done'?' ✓':q.status==='partial'?' ◐':'');b.onclick=()=>{sel=d;render()};t.appendChild(b)});let q=ds(sel),c=document.getElementById('day');c.innerHTML=`<h2>${sel} · semaine ${S.w}</h2><div class="modes">${['Samedi','Dimanche'].includes(sel)?(sel==='Samedi'?'<span class="btn on">😴 Repos prévu</span>':'<span class="btn on">🏃 Course tranquille</span>'):`<button class="btn ${q.mode==='home'?'on':''}" data-m="home">🏠 Maison</button><button class="btn ${q.mode==='coach'?'on':''}" data-m="coach">🏋️ Coaching</button><button class="btn ${q.mode==='rest'?'on':''}" data-m="rest">😴 Repos</button>`}</div><div id="ct"></div>`;if(sel==='Samedi')q.mode='home';if(sel==='Dimanche')q.mode='home';c.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{q.mode=b.dataset.m;save();render()});let ct=c.querySelector('#ct');
if(q.mode==='home')ex(sel).forEach((x,i)=>{let z=document.createElement('div');z.className='ex';z.innerHTML=`<h3>${x[0]}</h3><div class="muted">${x[1]}</div>`+x[2].map((s,j)=>`<div class="set"><span>${s[0]} · cible <b>${s[1]}</b></span><input type="number" min="0" data-k="${i}-${j}" value="${q.actual[i+'-'+j]??''}" placeholder="fait"></div>`).join('');ct.appendChild(z)});else if(q.mode==='coach')ct.innerHTML=`<div class="ex"><h3>Coaching</h3><p>${B[sel].c}</p></div>`;else ct.innerHTML='<div class="ex"><h3>Repos</h3><p>Pas de rattrapage automatique.</p></div>';
ct.insertAdjacentHTML('beforeend',`<label>Ressenti /10<input id="rpe" type="number" min="1" max="10" value="${q.rpe}"></label><label>Note<textarea id="dn">${q.note||''}</textarea></label><div class="actions"><button class="btn primary" data-s="done">✓ Terminée</button><button class="btn" data-s="partial">◐ Partielle</button><button class="btn" data-s="missed">✕ Non faite</button></div>`);
c.querySelectorAll('[data-k]').forEach(i=>i.oninput=()=>{q.actual[i.dataset.k]=Math.max(0,+i.value||0);save()});c.querySelector('#rpe').oninput=e=>{q.rpe=Math.max(1,Math.min(10,+e.target.value||5));save()};c.querySelector('#dn').oninput=e=>{q.note=e.target.value;save()};c.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{q.status=b.dataset.s;save();render()});
let done=D.reduce((n,d)=>n+(ds(d).status==='done'?1:ds(d).status==='partial'?.5:0),0),p=Math.round(done/7*100);document.getElementById('pct').textContent=p+'%';document.getElementById('bar').style.width=p+'%';document.getElementById('wn').textContent=S.w}
const val=id=>Math.max(1,Math.min(10,+document.getElementById(id).value||5));
document.getElementById('close').onclick=()=>{let g=val('wg'),l=val('wl'),a=val('wa'),m=[];if(a>=8||ds('Lundi').status==='partial'){S.lev.u=Math.max(0,S.lev.u-1);m.push('Haut du corps : maintien/allègement.')}else if(a<=6&&ds('Lundi').status==='done'){S.lev.u=Math.min(4,S.lev.u+1);m.push('Haut du corps : +1 rep par série.')}else m.push('Haut du corps : maintien.');
if(ds('Mardi').status==='done'&&ds('Mardi').rpe<=7){S.lev.r=Math.min(4,S.lev.r+1);m.push('Course : progression validée.')}else m.push('Course : niveau consolidé, aucun rattrapage.');
if(l>=8){S.lev.l=Math.max(-2,S.lev.l-1);m.push('Jambes : volume réduit.')}else m.push('Jambes : bloc conservé.');
if(g>=8)m.push('Semaine difficile : priorité récupération.');S.hist.push({w:S.w,g,l,a,note:document.getElementById('note').value});S.w++;S.d={};save();document.getElementById('result').innerHTML='<div class="ex"><h3 class="ok">Nouvelle semaine créée ✓</h3><p>'+m.join('<br>')+'</p></div>';render()};render();if('serviceWorker' in navigator){
navigator.serviceWorker.register('./sw.js').then(reg=>{
  reg.update();
  reg.addEventListener('updatefound',()=>{
    const nw=reg.installing;
    if(!nw)return;
    nw.addEventListener('statechange',()=>{
      if(nw.state==='activated') location.reload();
    });
  });
}).catch(()=>{});
}})();
</script></body></html>
